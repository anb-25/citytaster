# =====================================================================
# FILE: .github/workflows/test-deploy.yml
# PURPOSE: Build+push images to ECR, sync data/docker-compose.yml to S3,
#          then deploy on the always-on EC2 instance via SSM RunCommand
#          (no SSH key, no port 22 -- the instance is reached only through
#          AWS Systems Manager, using the OIDC role Terraform created).
# =====================================================================
name: CityTaster Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  DB_NAME: CityTasterDB
  S3_BUCKET: citytaster-dev-assets
  EC2_NAME_TAG: citytaster-dev-app

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS account ID
        id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          docker buildx build \
            --push \
            --file deployment/Dockerfile.backend \
            -t "${{ steps.ecr.outputs.registry }}/citytaster-backend:latest" \
            .

      - name: Build and push frontend image
        run: |
          docker buildx build \
            --push \
            --file deployment/Dockerfile.frontend \
            -t "${{ steps.ecr.outputs.registry }}/citytaster-frontend:latest" \
            .

      - name: Sync data + compose file to S3
        run: |
          aws s3 sync ./data "s3://${{ env.S3_BUCKET }}/data" --delete
          aws s3 cp ./docker-compose.yml "s3://${{ env.S3_BUCKET }}/deploy/docker-compose.yml"

      - name: Resolve EC2 instance ID
        id: ec2
        run: |
          set -euo pipefail
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ env.EC2_NAME_TAG }}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [[ "$ID" == "None" || -z "$ID" ]]; then
            echo "::error ::No running EC2 instance tagged Name=${{ env.EC2_NAME_TAG }} found."
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM RunCommand
        id: deploy
        run: |
          set -euo pipefail
          SCRIPT=$(cat <<EOF
          set -eu
          mkdir -p /home/ubuntu/app/data
          cd /home/ubuntu/app
          aws s3 cp s3://${{ env.S3_BUCKET }}/deploy/docker-compose.yml ./docker-compose.yml
          aws s3 sync s3://${{ env.S3_BUCKET }}/data ./data --delete
          cat > .env <<ENVEOF
          AWS_ACCOUNT_ID=${{ steps.account.outputs.id }}
          AWS_REGION=${{ env.AWS_REGION }}
          DB_NAME=${{ env.DB_NAME }}
          ENVEOF
          aws ecr get-login-password --region ${{ env.AWS_REGION }} > /tmp/ecrpw
          docker login --username AWS --password-stdin ${{ steps.account.outputs.id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com < /tmp/ecrpw
          rm -f /tmp/ecrpw
          docker compose pull
          docker compose up -d mongo
          for csv in ./data/*.csv; do
            collection=\$(basename "\$csv" .csv)
            echo "[INFO] Importing \$csv -> \$collection"
            docker compose exec -T mongo mongoimport --db ${{ env.DB_NAME }} --collection "\$collection" --type csv --headerline --file "/csv/\${collection}.csv" --drop
          done
          docker compose up -d
          docker image prune -af
          EOF
          )

          # Use a real JSON params file (not --parameters "commands=[...]" shorthand) --
          # the shorthand parser mangles embedded newlines in multi-line strings.
          jq -n --arg script "$SCRIPT" '{commands: [$script]}' > ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-params.json \
            --comment "citytaster deploy ${{ github.sha }}" \
            --query "Command.CommandId" --output text)
          echo "Command ID: $CMD_ID"

          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "${{ steps.ec2.outputs.id }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Status: $STATUS"
            if [[ "$STATUS" != "Pending" && "$STATUS" != "InProgress" && "$STATUS" != "Delayed" ]]; then
              break
            fi
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ steps.ec2.outputs.id }}" \
            --query "StandardOutputContent" --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ steps.ec2.outputs.id }}" \
            --query "StandardErrorContent" --output text >&2

          if [[ "$STATUS" != "Success" ]]; then
            echo "::error ::Deploy command finished with status $STATUS"
            exit 1
          fi

      - name: Output live URL
        run: |
          IP=$(aws ec2 describe-instances --instance-ids "${{ steps.ec2.outputs.id }}" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          {
            echo "### Deployed"
            echo "Live at: http://$IP"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Live at: http://$IP"
